<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplus | Matematika test platformasi</title>
<link rel="icon" type="image/svg+xml" href="/aplus-icon.svg">
<meta name="theme-color" content="#101b33">
<meta name="description" content="Aplus matematika test platformasi">
<style>
  :root { color-scheme:light; --bg:#f3f6fb; --card:#ffffff; --text:#172338; --muted:#64748b; --main:#2563eb; --bad:#dc2626; --ok:#16a34a; --line:#dfe6f0; --soft:#edf2f9; --shadow:0 10px 28px rgba(23,35,56,.06); }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0b1220; --card:#121c2d; --text:#e8eef8; --muted:#a1aec2; --main:#6b9cff; --bad:#ff7373; --ok:#4ade80; --line:#29364b; --soft:#1c2940; --shadow:0 10px 28px rgba(0,0,0,.2); }
  * { box-sizing: border-box; }
  body { margin:0; font-family:Inter, ui-sans-serif, system-ui, Arial, sans-serif; background:var(--bg); color:var(--text); transition:background .2s,color .2s; }
  body:before{content:"";position:fixed;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#2563eb,#8b5cf6,#d4af37);z-index:10;pointer-events:none}
  #app{min-height:calc(100vh - 70px)}
  ::selection{background:#93b4ff55}
  :focus-visible{outline:3px solid #6b9cff;outline-offset:2px}
  header { background:var(--card); border-bottom:1px solid var(--line); box-shadow:0 3px 16px #00000008; padding:13px max(16px,calc((100% - 1080px)/2)); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; position:sticky;top:0;z-index:5;backdrop-filter:blur(14px) }
  header>b{display:flex;align-items:center;gap:10px}
  
  header b { font-size:18px; cursor:pointer; }
  main { max-width:1020px; margin:0 auto; padding:24px 18px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:clamp(17px,3vw,26px); margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2{letter-spacing:-.025em}
  .card:has(.q){box-shadow:none}
  .q{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:clamp(16px,2.5vw,24px);margin:16px 0}
  .top{background:var(--card);padding:14px 16px;border:1px solid var(--line);border-radius:14px}
  .strip{padding:10px 0}
  .strip button{border-radius:10px;min-height:40px}
  .opts{gap:12px}
  button{border-radius:11px;font-weight:650;transition:transform .12s,filter .12s,background .2s;box-shadow:0 2px 4px #00000008}
  button:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  input[type=text],input[type=password],input[type=number]{background:var(--card);color:var(--text);border-color:var(--line);border-radius:11px;padding:12px}
  .profile-chip{background:var(--soft);color:var(--text)}
  .strip button{background:var(--soft);color:var(--text)}
  button.opt{background:var(--card);color:var(--text);border-color:var(--line);min-height:48px;border-radius:13px}
  button.sec{background:var(--soft);color:var(--text)}
  .muted{line-height:1.55}
  .test-focus{max-width:900px;margin:0 auto}
  @media(min-width:760px){.q{padding:24px}.opts{max-width:620px}}
  @media(max-width:600px){header{padding:10px 12px}main{padding:15px 12px 32px}.card{border-radius:15px;padding:16px}.big{font-size:28px}}
  h2 { margin:0 0 12px; font-size:20px; }
  input[type=text], input[type=password], input[type=number] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; margin-bottom:10px; }
  input[type=file] { margin:6px 0 10px; max-width:100%; }
  button { background:var(--main); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:15px; cursor:pointer; }
  button.sec { background:#e8edf3; color:var(--text); }
  button.del { background:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > input { flex:1; margin-bottom:0; min-width:140px; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .muted { color:var(--muted); font-size:14px; }
  .err { color:var(--bad); margin:8px 0; min-height:20px; }
  .q img { max-width:100%; border:1px solid var(--line); border-radius:8px; display:block; margin:8px 0; }
  .ok { color:var(--ok); font-weight:600; margin:6px 0; }
  .big { font-size:32px; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--line); }

  /* Savol sahifasi */
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .bar { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; background:var(--main); }
  .strip { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px; }
  .strip button { min-width:38px; padding:8px 6px; font-size:13px; background:#e8edf3; color:var(--text); }
  .strip button.cur { outline:3px solid var(--main); outline-offset:1px; }
  .strip button.right { background:var(--ok); color:#fff; }
  .strip button.wrong { background:var(--bad); color:#fff; }
  .opts { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  button.opt { background:#fff; color:var(--text); border:2px solid var(--line); min-width:70px; padding:12px 0; font-size:20px; font-weight:600; }
  button.opt:hover:not(:disabled) { border-color:var(--main); }
  button.opt:disabled { opacity:1; }
  button.opt.right { background:#dcfce7; border-color:var(--ok); color:#166534; }
  button.opt.wrong { background:#fee2e2; border-color:var(--bad); color:#991b1b; }
  input.right { border-color:var(--ok); background:#f0fdf4; }
  input.wrong { border-color:var(--bad); background:#fef2f2; }
  .fb { margin:2px 0 12px; font-weight:600; }
  .fb.right { color:var(--ok); }
  .fb.wrong { color:var(--bad); }
  .video video { width:100%; border-radius:8px; background:#000; display:block; }
  .video iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:8px; background:#000; display:block; }
  .nav { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .profile-chip {display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);padding:4px 8px;border-radius:999px}
  .avatar {width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e8edf3;border:1px solid var(--line)}
  .profile-form {max-width:440px;margin:18px auto}
  .vid { border-top:1px solid var(--line); margin-top:12px; padding-top:12px; }

  /* Aplus visual identity */
  :root { --main:#315de8; --shadow:0 14px 38px rgba(23,35,56,.075); }
  :root[data-theme="dark"] { --main:#7ea0ff; --shadow:0 16px 42px rgba(0,0,0,.22); }
  header { min-height:76px; padding:12px max(18px,calc((100% - 1160px)/2)); gap:16px; }
  .brandmark { display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none; }
  .brand-icon { display:grid; place-items:center; width:46px; height:46px; border-radius:15px; color:#172338; background:linear-gradient(145deg,#fff0b2 0%,#d8b64d 58%,#b48720 100%); font-size:20px; font-weight:950; letter-spacing:-1.5px; box-shadow:0 7px 18px #c39a3235; border:1px solid #f3df94; }
  .brand-copy { display:flex; flex-direction:column; gap:2px; font-size:17px; font-weight:900; letter-spacing:.08em; color:var(--text); }
  .brand-copy span { font-size:9px; letter-spacing:.13em; color:var(--muted); font-weight:750; }
  .header-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  .theme-toggle { display:flex; align-items:center; gap:7px; white-space:nowrap; border:1px solid var(--line); }
  main { max-width:1160px; padding:30px 22px 60px; }
  .card { border-radius:22px; padding:clamp(20px,3vw,32px); margin-bottom:20px; box-shadow:var(--shadow); }
  .card h2 { font-size:clamp(21px,2.2vw,27px); letter-spacing:-.04em; margin-bottom:18px; }
  .card > .muted:first-of-type { max-width:70ch; }
  #app > .card:first-child { position:relative; overflow:hidden; }
  #app > .card:first-child:has(#n) { max-width:520px; margin:clamp(30px,7vh,76px) auto; padding:clamp(26px,5vw,42px); }
  #app > .card:first-child:has(#n):before { content:"A+"; position:absolute; top:-45px; right:-12px; font-size:150px; line-height:1; font-weight:950; letter-spacing:-.12em; color:var(--main); opacity:.055; pointer-events:none; }
  #app > .card:first-child:has(#n) h2 { font-size:30px; }
  #app > .card:first-child:has(#n) h2:after { content:""; display:block; width:52px; height:4px; border-radius:9px; margin-top:12px; background:linear-gradient(90deg,var(--main),#c9a23b); }
  .item { padding:17px 0; border-color:var(--line); gap:16px; }
  .item > div:first-child b { font-size:16px; }
  .item .row { flex-shrink:0; }
  .item .row button { min-width:100px; }
  .top { padding:14px 16px; border-radius:16px; box-shadow:var(--shadow); }
  .bar { height:8px; border-radius:99px; margin:14px 0 8px; }
  .bar i { border-radius:99px; background:linear-gradient(90deg,var(--main),#8a69ef); transition:width .25s ease; }
  .strip { gap:8px; padding:12px 2px 16px; }
  .strip button { min-width:40px; min-height:40px; border:1px solid var(--line); }
  .strip button.cur { outline:2px solid var(--main); outline-offset:1px; }
  .strip button.right { background:#16a34a; border-color:#16a34a; color:white; }
  .strip button.wrong { background:#dc2626; border-color:#dc2626; color:white; }
  .q { border-radius:20px; padding:clamp(20px,4vw,36px); }
  .q > b { display:inline-block; font-size:19px; margin-bottom:6px; }
  .q > img { max-height:52vh; object-fit:contain; margin:18px 0; border-radius:14px; }
  .opts { gap:12px; margin:18px 0; }
  button.opt { min-width:76px; min-height:54px; border-radius:15px; font-size:19px; }
  button.opt:hover:not(:disabled) { background:color-mix(in srgb,var(--main) 8%,var(--card)); border-color:var(--main); }
  .nav { margin-top:16px; padding:12px 0; }
  .nav button { min-height:44px; }
  button { border-radius:12px; padding:11px 16px; font-weight:700; box-shadow:0 3px 8px #0000000a; }
  button.sec { background:var(--soft); border:1px solid var(--line); color:var(--text); }
  button.del { color:#fff; }
  input[type=text], input[type=password], input[type=number] { min-height:45px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  input:focus { border-color:var(--main); outline:3px solid color-mix(in srgb,var(--main) 18%,transparent); }
  .profile-form { max-width:620px; }
  .profile-form label { display:block; font-size:13px; font-weight:750; margin:10px 0 6px; }
  .profile-chip { border:1px solid var(--line); padding:5px 10px 5px 5px; }
  .avatar { width:40px; height:40px; }
  .big { letter-spacing:-.045em; }
  .err { font-size:14px; }
  table th { color:var(--muted); font-weight:750; }
  @media(max-width:640px) {
    header { padding:10px 12px; min-height:66px; }
    .brand-icon { width:39px;height:39px;border-radius:12px;font-size:17px; }
    .brand-copy { font-size:14px; }
    .brand-copy span { font-size:7px; }
    .theme-toggle { padding:9px 10px; }
    .theme-toggle span { display:none; }
    main { padding:18px 12px 40px; }
    .card { border-radius:17px; padding:18px; }
    .item { align-items:flex-start; flex-direction:column; }
    .item .row { width:100%; }
    .item .row button { flex:1; }
    .top { align-items:flex-start; }
    .q > img { max-height:40vh; }
    .nav { display:grid; grid-template-columns:1fr 1fr; }
    .nav button:nth-child(2) { grid-column:1 / -1; grid-row:1; }
    .nav button { width:100%; }
  }
  @media (prefers-reduced-motion: reduce) { *,*:before,*:after { transition:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
<header>
  <b class="brandmark" onclick="home()" aria-label="Aplus bosh sahifa"><span class="brand-icon">A+</span><span class="brand-copy">APLUS<span>MATEMATIKA PLATFORMASI</span></span></b>
  <div class="header-actions"><button class="theme-toggle sec" id="themeToggle" onclick="toggleTheme()" aria-label="Kun va tun rejimini almashtirish">🌙 <span>Tun rejimi</span></button><div id="who"></div></div>
</header>
<main id="app"></main>

<script>
const MAXC = 35; // 1..35 variantli, 36..45 ochiq javobli
const S = { token: localStorage.getItem('token'), name: localStorage.getItem('name'), role: localStorage.getItem('role'), profileName: localStorage.getItem('profileName') || '', firstName: localStorage.getItem('profileFirstName') || '', lastName: localStorage.getItem('profileLastName') || '', fatherName: localStorage.getItem('profileFatherName') || '', photo: localStorage.getItem('profilePhoto') || '' };
const $ = (id) => document.getElementById(id);
const THEME_KEY = 'aplusTheme';
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const btn = $('themeToggle');
  if (btn) { btn.innerHTML = theme === 'dark' ? '☀️ <span>Kun rejimi</span>' : '🌙 <span>Tun rejimi</span>'; btn.setAttribute('aria-pressed', String(theme === 'dark')); }
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next); applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'light');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token) { logout(); throw new Error(d.error); }
  if (!r.ok) throw new Error(d.error || 'Xatolik');
  return d;
}

function logout() {
  localStorage.clear();
  S.token = S.name = S.role = null;
  loginView();
}

function header() {
  $('who').innerHTML = S.token
    ? `<div class="row" style="justify-content:flex-end"><button class="profile-chip" onclick="profileView()" title="Profilim"><img class="avatar" src="${S.photo || ''}" onerror="this.style.display='none'" alt="Profil rasmi"><span style="text-align:left"><b style="font-size:14px">${esc(S.profileName || S.name)}${S.role === 'admin' ? ' (admin)' : ''}</b><br><span class="muted">Profilim</span></span></button><button class="sec" onclick="logout()">Chiqish</button></div>`
    : '';
}

function profileView() {
  header();
  $('app').innerHTML = `<div class="card profile-form"><h2>${S.profileName ? 'Profilim' : 'Profilni to‘ldiring'}</h2><p class="muted">Ism, familiya va otasining ismi alohida kiritiladi. Sertifikat shu ma’lumotlar va profil rasmini ishlatadi.</p>
  <label for="profileFirstName">Ism</label><input type="text" id="profileFirstName" placeholder="Masalan: Serik" value="${esc(S.firstName)}" autocomplete="given-name">
  <label for="profileLastName">Familiya</label><input type="text" id="profileLastName" placeholder="Masalan: Isayev" value="${esc(S.lastName)}" autocomplete="family-name">
  <label for="profileFatherName">Otasining ismi</label><input type="text" id="profileFatherName" placeholder="Masalan: Boynazar o‘g‘li" value="${esc(S.fatherName)}">
  <label for="profilePhoto">Profil rasmi</label><input type="file" id="profilePhoto" accept="image/*" onchange="previewProfilePhoto(event)"><div style="margin:8px 0 14px"><img id="profilePreview" class="avatar" style="width:88px;height:88px;${S.photo ? '' : 'display:none;'}" src="${S.photo || ''}" alt="Rasm ko‘rinishi"></div><div class="err" id="profileError"></div><div class="row"><button onclick="saveProfile()">Saqlash</button>${S.profileName ? '<button class="sec" onclick="home()">Bekor qilish</button>' : ''}</div></div>`;
}
function previewProfilePhoto(event) {
  const file = event.target.files && event.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { $('profileError').textContent = 'Iltimos, rasm faylini tanlang.'; return; }
  if (file.size > 4 * 1024 * 1024) { $('profileError').textContent = 'Rasm 4 MB dan kichik bo‘lsin.'; event.target.value = ''; return; }
  const reader = new FileReader(); reader.onload = () => { S.pendingPhoto = reader.result; $('profilePreview').src = reader.result; $('profilePreview').style.display = 'inline-block'; }; reader.readAsDataURL(file);
}
function saveProfile() {
  const first = $('profileFirstName').value.trim(), last = $('profileLastName').value.trim(), father = $('profileFatherName').value.trim();
  if (!first || !last || !father) { $('profileError').textContent = 'Ism, familiya va otasining ismini alohida maydonlarga kiriting.'; return; }
  S.firstName = first; S.lastName = last; S.fatherName = father; S.profileName = [first, last, father].join(' ');
  if (S.pendingPhoto) S.photo = S.pendingPhoto;
  localStorage.setItem('profileName', S.profileName); localStorage.setItem('profileFirstName', first); localStorage.setItem('profileLastName', last); localStorage.setItem('profileFatherName', father);
  if (S.photo) localStorage.setItem('profilePhoto', S.photo);
  S.pendingPhoto = ''; home();
}

/* ---------- Kirish ---------- */
function loginView() {
  header();
  $('app').innerHTML = `
    <div class="card">
      <h2>Kirish</h2>
      <input type="text" id="n" placeholder="Ism" autocomplete="username">
      <input type="password" id="p" placeholder="Parol" autocomplete="current-password">
      <div class="err" id="e"></div>
      <div class="row">
        <button onclick="auth('login')">Kirish</button>
        <button class="sec" onclick="auth('register')">Ro'yxatdan o'tish</button>
      </div>
    </div>`;
}

async function auth(mode) {
  try {
    const d = await api('/auth', 'POST', { mode, name: $('n').value, pass: $('p').value });
    S.token = d.token; S.name = d.name; S.role = d.role;
    localStorage.setItem('token', d.token); localStorage.setItem('name', d.name); localStorage.setItem('role', d.role);
    if (!S.profileName) profileView(); else home();
  } catch (e) { $('e').textContent = e.message; }
}

/* ---------- Bosh sahifa ---------- */
async function home() {
  if (!S.token) return loginView();
  if (!S.profileName) return profileView();
  header();
  const tests = await api('/tests');
  const admin = S.role === 'admin';
  $('app').innerHTML = `
    ${admin ? `<div class="card"><h2>Yangi test qo'shish</h2>
      <div class="row"><input type="text" id="tt" placeholder="Test nomi"><button onclick="addTest()">Qo'shish</button></div>
      <div class="err" id="e"></div></div>` : ''}
    <div class="card">
      <h2>Testlar</h2>
      ${tests.length ? tests.map((t) => `
        <div class="item">
          <div><b>${esc(t.title)}</b><div class="muted">${t.count} ta savol</div></div>
          <div class="row">
            <button onclick="openTest('${t.id}')">${admin ? 'Tahrirlash' : 'Boshlash'}</button>
            ${admin ? `<button class="del" onclick="delTest('${t.id}')">O'chirish</button>` : ''}
          </div>
        </div>`).join('') : '<div class="muted">Hozircha testlar yo\'q</div>'}
    </div>
    <button class="sec" onclick="resultsView()">${admin ? 'Barcha natijalar' : 'Mening natijalarim'}</button>`;
}

async function addTest() {
  try { const d = await api('/tests', 'POST', { title: $('tt').value }); openTest(d.id); }
  catch (e) { $('e').textContent = e.message; }
}
async function delTest(id) {
  if (confirm("Testni o'chirasizmi?")) { await api('/tests/' + id, 'DELETE'); home(); }
}

/* ---------- Test (umumiy) ---------- */
let T = null;      // hozirgi test
let idx = 0;       // hozirgi savol o'rni
let prog = {};     // num -> { answer, res }  (foydalanuvchi javoblari va tekshiruv natijasi)

async function openTest(id) {
  T = await api('/tests/' + id);
  if (S.role === 'admin') return adminView();
  prog = loadProg();
  const first = T.questions.findIndex((q) => !prog[q.num]);
  idx = first < 0 ? 0 : first;
  render();
}

const pkey = () => 'prog_' + S.name + '_' + T.id;
function loadProg() { try { return JSON.parse(localStorage.getItem(pkey()) || '{}'); } catch (e) { return {}; } }
function saveProg() { try { localStorage.setItem(pkey(), JSON.stringify(prog)); } catch (e) {} }

/* ---------- Test: o'quvchi ko'rinishi (har savol alohida sahifa) ---------- */
function videoBody(v) {
  if (!v) return '<div class="muted">Bu savol uchun yechim videosi hali qo\'yilmagan.</div>';
  if (v.kind === 'file') return `<video controls preload="metadata" src="${esc(v.url)}"></video>`;
  if (v.kind === 'embed') return `<iframe src="${esc(v.url)}" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe>`;
  return `<a href="${esc(v.url)}" target="_blank" rel="noopener">Videoni ochish</a>`;
}

function answerHTML(q, a) {
  if (q.num <= MAXC) {
    const btns = ['A', 'B', 'C', 'D'].map((o) => {
      let c = '';
      if (a) { if (o === a.res.right) c = 'right'; else if (o === a.answer) c = 'wrong'; }
      return `<button class="opt ${c}" ${a ? 'disabled' : ''} onclick="pick('${o}')">${o}</button>`;
    }).join('');
    let fb = '';
    if (a) fb = a.res.correct
      ? '<div class="fb right">To\'g\'ri!</div>'
      : `<div class="fb wrong">Noto'g'ri. To'g'ri javob: ${esc(a.res.right)}</div>`;
    return `<div class="opts">${btns}</div>${fb}`;
  }
  const part = (k) => {
    const val = a ? a.answer[k] : '';
    const ok = a ? a.res.parts[k] : null;
    let h = `<label class="muted" for="o${k}">${k}) javob</label>
      <input type="text" id="o${k}" value="${esc(val || '')}" ${a ? 'disabled' : ''} class="${a ? (ok ? 'right' : 'wrong') : ''}">`;
    if (a) h += ok
      ? '<div class="fb right">To\'g\'ri</div>'
      : `<div class="fb wrong">Noto'g'ri. To'g'ri javob: ${esc(a.res.right[k])}</div>`;
    return h;
  };
  return part('a') + part('b') + (a ? '' : '<button onclick="checkOpen()">Tekshirish</button>');
}

function render() {
  header();
  const qs = T.questions;
  if (!qs.length) {
    $('app').innerHTML = `<button class="sec" onclick="home()">← Orqaga</button>
      <div class="card muted" style="margin-top:12px">Bu testda hali savollar yo'q</div>`;
    return;
  }
  const q = qs[idx];
  const a = prog[q.num];
  const done = qs.filter((x) => prog[x.num]).length;
  const strip = qs.map((x, i) => {
    const p = prog[x.num];
    const cls = (i === idx ? 'cur ' : '') + (p ? (p.res.correct ? 'right' : 'wrong') : '');
    return `<button class="${cls}" onclick="go(${i})">${x.num}</button>`;
  }).join('');

  $('app').innerHTML = `
    <div class="top">
      <button class="sec" onclick="home()">← Orqaga</button>
      <div class="muted">${esc(T.title)} · javob berildi: ${done}/${qs.length}</div>
    </div>
    <div class="bar"><i style="width:${Math.round(done / qs.length * 100)}%"></i></div>
    <div class="strip">${strip}</div>
    <div class="card q">
      <b>${q.num}-savol</b> <span class="muted">(${idx + 1} / ${qs.length} · ${q.points ?? (q.num <= MAXC ? 1 : 2)} ball)</span>
      <img src="/uploads/${esc(q.image)}" alt="">
      ${answerHTML(q, a)}
    </div>
    ${a ? `<div class="card video"><h2>Yechim videosi</h2>${videoBody(a.res.video)}</div>` : ''}
    <div class="nav">
      <button class="sec" onclick="go(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>← Oldingi</button>
      <button onclick="finish()" class="${idx === qs.length - 1 ? '' : 'sec'}">Yakunlash</button>
      <button class="sec" onclick="go(${idx + 1})" ${idx === qs.length - 1 ? 'disabled' : ''}>Keyingi →</button>
    </div>`;
}

function go(i) {
  if (i < 0 || i >= T.questions.length) return;
  idx = i;
  render();
  window.scrollTo(0, 0);
}

async function pick(o) {
  const q = T.questions[idx];
  if (prog[q.num]) return;
  try {
    const res = await api('/tests/' + T.id + '/check', 'POST', { num: q.num, answer: o });
    prog[q.num] = { answer: o, res };
    saveProg();
    render();
  } catch (e) { alert(e.message); }
}

async function checkOpen() {
  const q = T.questions[idx];
  if (prog[q.num]) return;
  const answer = { a: $('oa').value, b: $('ob').value };
  if (!answer.a.trim() && !answer.b.trim()) { alert('Avval javobni yozing'); return; }
  try {
    const res = await api('/tests/' + T.id + '/check', 'POST', { num: q.num, answer });
    prog[q.num] = { answer, res };
    saveProg();
    render();
  } catch (e) { alert(e.message); }
}

async function finish() {
  const left = T.questions.filter((q) => !prog[q.num]).length;
  if (!confirm(left ? left + ' ta savol javobsiz qoldi. Testni yakunlaysizmi?' : 'Testni yakunlaysizmi?')) return;
  const answers = {};
  T.questions.forEach((q) => { if (prog[q.num]) answers[q.num] = prog[q.num].answer; });
  try {
    const r = await api('/tests/' + T.id + '/submit', 'POST', { answers });
    try { localStorage.removeItem(pkey()); } catch (e) {}
    // Sertifikat darajasi ball qiymatiga emas, 55 ta savoldan nechta to'g'ri topilganiga bog'liq.
    const correctCount = T.questions.reduce((n, q) => n + (prog[q.num] && prog[q.num].res && prog[q.num].res.correct === true ? 1 : 0), 0);
    const pct = Math.round((correctCount / 55) * 100);
    const grade = correctCount >= 52 ? 'A+' : correctCount >= 50 ? 'A' : correctCount >= 47 ? 'B+' : correctCount >= 43 ? 'B' : correctCount >= 38 ? 'C+' : correctCount >= 33 ? 'C' : 'Talabga yetmadi';
    const cert = 'APL-' + new Date().getFullYear() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    $('app').innerHTML = `<div class="card"><h2>Test natijasi</h2><div class="big">${r.score} / ${r.max} ball</div>
      <p><b>To‘g‘ri javoblar:</b> ${correctCount} / 55 &nbsp; <b>Foiz:</b> ${pct}% &nbsp; <b>Daraja:</b> ${grade}</p>
      <p class="muted">Ballar admin belgilagan savol qiymatlari asosida hisoblandi. Sertifikat darajasi esa ball qiymatiga emas, 55 ta savoldan nechta to‘g‘ri topilganiga qarab belgilanadi.</p>
      <div class="row"><button id="getCertificateBtn" type="button">📜 Sertifikatni olish / chop etish</button>
      <button class="sec" onclick="home()">Bosh sahifa</button></div>
      <p class="muted">Sertifikat Aplus o‘quv markazining ichki natija sertifikati bo‘lib, davlat yoki rasmiy milliy sertifikat o‘rnini bosmaydi.</p></div>`;
    $('getCertificateBtn').addEventListener('click', () => {
      makeCertificate(S.profileName || S.name, 'Matematika', String(r.score), String(r.max), String(correctCount), String(pct), grade, cert, S.photo || '');
    });
  } catch (e) { alert(e.message); }
}

/* ---------- Test: admin ko'rinishi ---------- */
function adminView() {
  const cards = T.questions.map((q) => {
    const open = q.num > MAXC;
    const corr = open ? `a) ${esc(q.correct.a)} &nbsp; b) ${esc(q.correct.b)}` : esc(q.correct);
    const vid = q.video
      ? `<div class="video" style="margin:8px 0">${videoBody(q.video)}</div>
         <button class="sec" onclick="delVideo(${q.num})">Videoni o'chirish</button>`
      : videoForm(q.num);
    return `<div class="card q"><b>${q.num}-savol</b>
      <img src="/uploads/${esc(q.image)}" alt="">
      <div class="ok">To'g'ri javob: ${corr}</div>
      <div class="row" style="margin:10px 0"><label>Ball:</label><input type="number" id="pts${q.num}" min="0" max="1000" step="0.5" value="${q.points ?? (q.num <= MAXC ? 1 : 2)}" style="max-width:120px"><button class="sec" onclick="savePoints(${q.num})">Ballni saqlash</button></div>
      <div class="vid"><b>Yechim videosi</b>${vid}</div>
      <div style="margin-top:12px"><button class="del" onclick="delQ(${q.num})">Savolni o'chirish</button></div>
    </div>`;
  }).join('');

  $('app').innerHTML = `
    <button class="sec" onclick="home()">← Orqaga</button>
    <h2 style="margin-top:12px">${esc(T.title)}</h2>
    ${adminForm()}
    ${cards || '<div class="card muted">Bu testda hali savollar yo\'q</div>'}`;
  numChanged();
}

function adminForm() {
  return `<div class="card">
    <h2>Savol qo'shish / almashtirish</h2>
    <input type="number" id="num" min="1" max="45" placeholder="Savol raqami (1–45)" oninput="numChanged()">
    <div class="muted">Rasm (savol va variantlar rasmda bo'ladi):</div>
    <input type="file" id="img" accept="image/*">
    <label for="points">Savol uchun ball (ochiq savolda a va b orasida teng taqsimlanadi):</label><input type="number" id="points" min="0" max="1000" step="0.5" value="1">
    <div id="ans"></div>
    <div class="err" id="e"></div>
    <button onclick="saveQ()">Saqlash</button>
    <div class="muted" style="margin-top:10px">Savol saqlangach, uning kartasida "Yechim videosi" qo'shish qismi paydo bo'ladi.</div>
  </div>`;
}

function videoForm(num) {
  return `<div class="muted">Video fayl yuklang (mp4, webm — 300 MB gacha):</div>
    <input type="file" id="vf${num}" accept="video/*">
    <button onclick="uploadVideo(${num})">Yuklash</button>
    <div class="muted" style="margin:10px 0 6px">yoki havola qo'ying (YouTube va boshqalar):</div>
    <div class="row"><input type="text" id="vu${num}" placeholder="https://..."><button onclick="saveVideoUrl(${num})">Saqlash</button></div>
    <div class="err" id="vs${num}"></div>`;
}

function numChanged() {
  const n = parseInt($('num').value, 10);
  if (n > MAXC) {
    if ($('points')) $('points').value = 2;
    $('ans').innerHTML = `<div class="muted">Ochiq savol: ikkita to'g'ri javob</div>
      <input type="text" id="ca" placeholder="a) to'g'ri javob"><input type="text" id="cb" placeholder="b) to'g'ri javob">`;
  } else {
    if ($('points')) $('points').value = 1;
    $('ans').innerHTML = `<div class="muted">To'g'ri variant:</div>
      <div class="opts">${['A','B','C','D'].map((o) => `<label style="font-size:17px;margin-right:14px"><input type="radio" name="cor" value="${o}"> ${o}</label>`).join('')}</div>`;
  }
}

function readFile(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
}

async function saveQ() {
  try {
    const num = parseInt($('num').value, 10);
    const f = $('img').files[0];
    const body = { num, points: Number($('points').value) };
    if (f) body.image = await readFile(f);
    if (num > MAXC) body.correct = { a: $('ca').value, b: $('cb').value };
    else { const c = document.querySelector('input[name=cor]:checked'); body.correct = c ? c.value : ''; }
    await api('/tests/' + T.id + '/questions', 'POST', body);
    openTest(T.id);
  } catch (e) { $('e').textContent = e.message; }
}

async function savePoints(num) {
  try { await api('/tests/' + T.id + '/questions/' + num + '/points', 'POST', { points: Number($('pts' + num).value) }); alert('Ball saqlandi'); openTest(T.id); }
  catch (e) { alert(e.message); }
}

async function delQ(num) {
  if (confirm(num + "-savolni o'chirasizmi?")) { await api('/tests/' + T.id + '/questions/' + num, 'DELETE'); openTest(T.id); }
}

function uploadVideo(num) {
  const f = $('vf' + num).files[0];
  const st = $('vs' + num);
  if (!f) { st.className = 'err'; st.textContent = 'Avval video faylni tanlang'; return; }
  if (f.size > 300 * 1024 * 1024) { st.className = 'err'; st.textContent = 'Fayl 300 MB dan katta'; return; }
  const x = new XMLHttpRequest();
  x.open('POST', '/api/tests/' + T.id + '/questions/' + num + '/video');
  x.setRequestHeader('Authorization', 'Bearer ' + S.token);
  x.setRequestHeader('Content-Type', f.type || 'video/mp4');
  x.upload.onprogress = (e) => {
    if (e.lengthComputable) { st.className = 'muted'; st.textContent = 'Yuklanmoqda: ' + Math.round(e.loaded / e.total * 100) + '%'; }
  };
  x.onload = () => {
    if (x.status === 200) return openTest(T.id);
    let m = 'Xatolik';
    try { m = JSON.parse(x.responseText).error; } catch (e) {}
    st.className = 'err'; st.textContent = m;
  };
  x.onerror = () => { st.className = 'err'; st.textContent = 'Yuklashda xatolik'; };
  x.send(f);
}

async function saveVideoUrl(num) {
  try {
    await api('/tests/' + T.id + '/questions/' + num + '/video-url', 'POST', { url: $('vu' + num).value });
    openTest(T.id);
  } catch (e) { $('vs' + num).textContent = e.message; }
}

async function delVideo(num) {
  if (confirm("Yechim videosini o'chirasizmi?")) { await api('/tests/' + T.id + '/questions/' + num + '/video', 'DELETE'); openTest(T.id); }
}

/* ---------- Natijalar ---------- */
async function resultsView() {
  const list = await api('/results');
  const admin = S.role === 'admin';
  $('app').innerHTML = `<button class="sec" onclick="home()">← Orqaga</button>
    <div class="card" style="margin-top:12px"><h2>Natijalar</h2>
    ${list.length ? `<table><tr>${admin ? '<th>Foydalanuvchi</th>' : ''}<th>Test</th><th>Ball</th><th>Sana</th></tr>
      ${list.map((r) => `<tr>${admin ? `<td>${esc(r.user)}</td>` : ''}<td>${esc(r.title)}</td><td>${r.score}/${r.max}</td><td>${new Date(r.date).toLocaleString()}</td></tr>`).join('')}</table>`
      : '<div class="muted">Natijalar yo\'q</div>'}</div>`;
}

S.token ? ((!S.profileName) ? profileView() : home().catch(loginView)) : loginView();
</script>
